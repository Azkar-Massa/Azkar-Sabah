<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار الصباح</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <div class="container">
        <h2>🌅 أذكار الصباح</h2>
        
        <div class="card">
            <p id="zikr-text">اضغط على الشاشة أو زر الاستماع للبدء</p>
            
            <div class="audio-control">
                <button id="play-audio-btn">🔊 استمع للشيخ</button>
            </div>

            <div class="counter-section">
                <span id="current-count" class="counter-num">0</span> <span class="counter-label">من</span> <span id="total-count" class="counter-num">0</span>
            </div>

            <button id="count-btn" class="main-btn">اضغط للتسبيح</button>
        </div>

        <div class="navigation-box">
            <button id="next-btn" class="nav-btn">الذكر التالي ⬅️</button>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
